name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend (Python)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: platform
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: "3.12"
          enable-cache: true
          cache-dependency-glob: platform/uv.lock
      - run: uv sync --locked
      - name: Lint
        run: uv run ruff check . && uv run ruff format --check .
      - name: Type check
        run: uv run mypy
      - name: Tests
        run: uv run pytest -p no:warnings
      - name: Inference and evaluation tests (P3 code, run in the platform environment)
        run: PYTHONPATH="..:src" uv run pytest -p no:warnings ../inference/tests ../evaluation/tests
      - name: Generated contracts, fixtures and sample recording are up to date
        run: |
          uv run python scripts/generate_contracts.py --check
          uv run python scripts/make_fixtures.py --check
          uv run python scripts/make_sample_recording.py --check

  frontend:
    name: Frontend (TypeScript)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - name: Generated TS types match the schema
        run: npm run contracts:types:check
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - run: npx vite build

  e2e-infra:
    name: Infrastructure e2e (Playwright, Chromium)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: "3.12"
          enable-cache: true
          cache-dependency-glob: platform/uv.lock
      - run: uv sync --locked
        working-directory: platform
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - name: Playwright infrastructure tests
        run: npx playwright test
      - name: Upload failure diagnostics (traces, screenshots, report)
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-diagnostics
          path: |
            frontend/playwright-report/
            frontend/test-results/**/*.zip
            frontend/test-results/**/*.png
          retention-days: 3
          if-no-files-found: ignore
