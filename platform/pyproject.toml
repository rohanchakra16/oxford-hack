[project]
name = "oxford-hack-platform"
version = "0.1.0"
description = "Local backend for the oxford-hack lecture review prototype (contracts, transport, timing, harness)."
requires-python = ">=3.11,<3.14"
dependencies = [
  "fastapi>=0.115",
  "uvicorn>=0.30",
  "websockets>=13",
  "pydantic>=2.11",
  "PyJWT[crypto]>=2.10,<3",
]

[project.scripts]
oxford-backend = "oxford_hack.cli:main"

[dependency-groups]
dev = [
  "pytest>=8",
  "httpx>=0.27",
  "ruff>=0.6",
  "mypy>=1.11",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/oxford_hack"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 110
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "RUF"]
ignore = ["RUF012"]

[tool.mypy]
python_version = "3.11"
strict = true
plugins = ["pydantic.mypy"]
files = ["src", "tests", "scripts"]

[[tool.mypy.overrides]]
module = ["tests.*"]
disallow_untyped_defs = false
warn_unused_ignores = false
disable_error_code = ["arg-type", "index", "union-attr", "type-arg", "attr-defined", "import-not-found"]
